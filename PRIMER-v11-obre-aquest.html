function chartDetails(model,metric,unit){return `<details class="overview-data-table"><summary>Veure dades de la gràfica</summary><div class="overview-table-scroll"><table><thead><tr><th>${model.unit==='week'?'Setmana des de':'Mes'}</th><th>${esc(unit)}</th><th>Sessions</th></tr></thead><tbody>${model.bins.map(b=>`<tr><td>${esc(b.label)}${b.partialPeriod?' *':''}</td><td>${b[metric]===null?'Sense dades':num(metric==='seconds'?b.seconds/60:b[metric],1)}</td><td>${b.sessions}</td></tr>`).join('')}</tbody></table></div></details>`}
function overviewPanel(model,range=28,type='all'){const {stats:s,prior:p,bounds}=model,has=s.sessions>0,period=model.unit==='week'?'setmana':'mes',coverage=s.volumeEligible?`${s.volumeKnown} de ${s.volumeEligible} sèries de manuelles amb volum calculable`:'Cap sèrie de manuelles registrada en aquest període';const cards=[['Sessions',s.sessions,p.sessions,`${s.days} dies actius · ${s.quick} sessions ràpides`],['Temps de treball',s.seconds/60,p.seconds/60,'Minuts de sèries, sense descansos'],['Sèries / costats',s.sets,p.sets,`${s.partial} entrades interrompudes incloses`],['Volum extern anotat',s.volume,p.volume,'kg·reps de les sèries amb dades completes']];return `<section class="general-overview"><div class="overview-header"><div><h2>Resum general</h2><p>Rutines i sessions ràpides, amb la feina que realment has guardat.</p></div><div class="overview-controls"><label>Període<select id="overview-range">${[[28,'4 setmanes'],[84,'12 setmanes'],[365,'Últims 365 dies'],['all','Tot l’historial']].map(([v,label])=>`<option value="${v}" ${String(range)===String(v)?'selected':''}>${label}</option>`).join('')}</select></label><label>Sessions<select id="overview-type">${[['all','Totes'],['routine','Només rutines'],['quick','Només ràpides']].map(([v,label])=>`<option value="${v}" ${v===type?'selected':''}>${label}</option>`).join('')}</select></label></div></div><p class="overview-date-range">${new Date(bounds.start).toLocaleDateString('ca-ES',{day:'numeric',month:'short',year:'numeric'})} — ${new Date(bounds.now).toLocaleDateString('ca-ES',{day:'numeric',month:'short',year:'numeric'})}${bounds.compare?' · Comparació amb els '+bounds.days+' dies anteriors':''}</p><div class="overview-stats">${cards.map(([label,value,old,description],i)=>{const delta=compareMetric(value,old,bounds.compare);return `<article class="card overview-stat"><span>${label}</span><strong>${value===null?'—':num(value,i===1?1:0)}${i===1?'<small>min</small>':i===3?'<small>kg·reps</small>':''}</strong><p>${esc(description)}</p><small class="overview-delta">${esc(delta.text)}</small></article>`}).join('')}</div>${!has?'<div class="notice">No hi ha sessions guardades amb aquests filtres. No s’hi afegeixen dades d’exemple. Prova un altre període o registra una sessió.</div>':''}<div class="overview-charts"><section class="card"><div class="section-head"><h3>Sessions per ${period}</h3><span class="overview-unit">${num(s.sessions)} sessions</span></div><div class="overview-legend"><span><i style="background:#3b82e6"></i>Rutina</span><span><i style="background:#1b8c87"></i>Ràpida</span></div>${has?bars(model,'sessions','sessions','sessions',true):'<div class="chart-empty">Aquí veuràs la freqüència d’entrenament.</div>'}${overviewCaption('sessions','Toca una barra per veure sessions i dies actius. Dues sessions el mateix dia compten com dues sessions, però només un dia actiu.')}${has?chartDetails(model,'sessions','Sessions'):''}</section><section class="card"><div class="section-head"><h3>Temps de treball per ${period}</h3><span class="overview-unit">minuts</span></div>${has?timeLine(model):'<div class="chart-empty">Es calcula amb els intervals de treball guardats.</div>'}${overviewCaption('time','Toca un punt per veure’n els minuts. Inclou intervals interromputs desats, però no descansos ni pauses.')}${has?chartDetails(model,'seconds','Minuts de treball'):''}</section><section class="card"><div class="section-head"><h3>Volum extern anotat per ${period}</h3><span class="overview-unit">kg·reps</span></div>${s.volume!==null?bars(model,'volume','chartVolume','kg·reps'):'<div class="chart-empty">Cal anotar pes i repeticions en alguna sèrie de manuelles. Les sèries sense aquestes dades no es converteixen en zeros ficticis.</div>'}<p class="overview-coverage">${esc(coverage)}.</p>${overviewCaption('volume','No suma pes corporal estimat ni grippers. Una marca ratllada indica sessions sense volum calculable. Més volum no implica automàticament més força.')}${has?chartDetails(model,'chartVolume','kg·reps externs'):''}</section><section class="card"><div class="section-head"><h3>Distribució per exercici</h3><span class="overview-unit">temps de treball</span></div>${model.ranking.length?`<div class="overview-ranking">${model.ranking.slice(0,8).map((g,i)=>`<button data-overview-chart="distribution" data-overview-value="${esc(g.name+': '+num(g.seconds/60,1)+' minuts · '+g.sets+' sèries / costats')}" class="overview-rank"><span>${esc(g.name)}</span><b>${num(g.seconds/60,1)} min</b><i><em style="width:${g.seconds/Math.max(1,model.ranking[0].seconds)*100}%"></em></i></button>`).join('')}</div>${model.ranking.length>8?'<p class="muted">Es mostren els 8 exercicis amb més temps de treball.</p>':''}`:'<div class="chart-empty">Aquí veuràs quins exercicis concentren el teu temps de treball.</div>'}${overviewCaption('distribution','La distribució és per temps, no per fatiga ni per força. Esquerra i dreta se sumen perquè són temps de treball diferents.')}</section></div><details class="model-details"><summary>Com llegir aquestes gràfiques</summary><p>El període inclou avui; el dia actual i les setmanes o mesos dels extrems poden ser parcials. La comparació utilitza el mateix nombre de dies immediatament anteriors, amb el mateix filtre de sessions. A «Tot l’historial» no es calcula una comparació arbitrària. Les sessions s’assignen a la data local d’inici.</p><p>Una sèrie unilateral desa cada costat com una entrada. Les sessions acabades abans d’hora compten la feina desada; no s’omplen amb allò que faltava fer. El volum extern és pes × repeticions × manuelles simultànies segons el registre; no és treball mecànic ni un indicador directe de força. Si falten reps o kg, el volum mesurat és només parcial: consulta la cobertura abans de comparar-lo.</p><p>Les gràfiques s’agrupen per setmanes de dilluns a diumenge fins a 12 setmanes; per períodes més llargs, s’agrupen per mesos perquè es puguin consultar al mòbil. Els dies sense sessions continuen dins del període i no es comprimeixen.</p></details></section>`}

function strengthChart(history,metric,label,unit){const points=history.map(h=>({at:h.at,value:h[metric]})).filter(p=>p.value!==null&&Number.isFinite(p.value));if(!points.length)return `<div class="chart-empty">Encara no hi ha dades de ${label.toLowerCase()}. Les sèries sense repeticions no generen volum fictici.</div>`;const max=Math.max(1,...points.map(p=>p.value))*1.12,x=i=>46+(points.length===1?135:i/(points.length-1)*286),y=v=>153-v/max*120;let best=-1;const records=points.map((p,i)=>{const pr=p.value>best;best=Math.max(best,p.value);return pr?i:-1}).filter(i=>i>=0);return `<svg class="strength-chart" viewBox="0 0 360 200" role="img" aria-label="${esc(label)}: ${points.length} sessions, màxim ${Math.max(...points.map(p=>p.value)).toFixed(1)} ${esc(unit)}"><g stroke="#e5ebf3" fill="none">${[0,.5,1].map(f=>`<path d="M46 ${153-f*120}H332"/>`).join('')}</g><g fill="#64748b" font-size="11">${[0,.5,1].map(f=>`<text x="38" y="${157-f*120}" text-anchor="end">${(max*f).toFixed(f?1:0)}</text>`).join('')}<text x="46" y="187">${new Date(points[0].at).toLocaleDateString('ca-ES',{day:'2-digit',month:'2-digit'})}</text><text x="332" y="187" text-anchor="end">${new Date(points.at(-1).at).toLocaleDateString('ca-ES',{day:'2-digit',month:'2-digit'})}</text></g><polyline points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.5"/>${points.map((p,i)=>`<circle tabindex="0" role="button" data-chart-detail="${esc(new Date(p.at).toLocaleString('ca-ES')+' · '+p.value.toFixed(1)+' '+unit)}" aria-label="${esc(new Date(p.at).toLocaleDateString('ca-ES')+': '+p.value.toFixed(1)+' '+unit)}" cx="${x(i)}" cy="${y(p.value)}" r="${records.includes(i)?4.5:3}" fill="${records.includes(i)?'#e6a126':'#2563eb'}"><title>${new Date(p.at).toLocaleString('ca-ES')} · ${p.value.toFixed(1)} ${esc(unit)}${records.includes(i)?' · Nou màxim registrat':''}</title></circle>`).join('')}</svg><p class="chart-point-detail" id="chart-point-detail" aria-live="polite">Toca un punt per veure’n el valor.</p><p class="chart-note">Punts daurats: nou màxim registrat. ${unit==='kg'?'Pes per manuella, no suma de les dues.':''} ${unit.includes('kg·reps')?'El volum kg·reps no és el pes aixecat en una sola repetició.':''} ${points.length===1?'Calen més sessions per veure una tendència.':''}</p>`}
function exerciseHub(data,id,metric='weight'){const exs=catalog(data.routines),e=exs.find(e=>e.id===id)||exs[0];if(!e)return '<div class="empty">Afegeix un exercici a Rutina.</div>';const cfg=config(e),kind=equipment(e),history=exerciseHistory(data.logs,e.id),suggestion=recommendation(e,data.logs),allSets=history.flatMap(h=>h.sets),weights=history.map(h=>kind==='grip'?h.resistance:h.weight).filter(v=>v!==null),volumes=history.map(h=>h.bestSetVolume).filter(v=>v!==null),bestWeight=weights.length?Math.max(...weights):null,bestSet=volumes.length?Math.max(...volumes):null;const baseOptions=kind==='bodyweight'?(e.tracking==='time'?[['seconds','Temps de treball','s']]:[['reps','Repeticions registrades','reps'],...(e.id==='pushup'?[['estimatedVolume','Volum corporal estimat','kg·reps estimats']]:[])]) :kind==='grip'?[['resistance','Resistència registrada','kg nominals'],['reps','Repeticions registrades','reps']]:[['weight','Pes màxim registrat','kg'],['volume','Volum extern per sessió','kg·reps'],['reps','Repeticions registrades','reps']];const options=[...(kind==='bodyweight'&&e.tracking!=='time'?[['seconds','Temps de treball','s']]:[]),...baseOptions,...(kind!=='bodyweight'?[['seconds','Temps de treball','s']]:[]),['setCount','Sèries / costats','sèries']];const active=options.find(o=>o[0]===metric)||options[0];return `<div class="exercise-hub"><section class="card exercise-select-card"><label for="exercise-select">Exercici<select id="exercise-select">${exs.map(ex=>`<option value="${esc(ex.id)}" ${ex.id===e.id?'selected':''}>${esc(ex.name)}</option>`).join('')}</select></label><p class="muted">Tria un exercici de la teva rutina. Pots fer-lo sol, consultar-ne el registre o revisar la progressió.</p><button class="secondary jump-quick" data-action="jump-quick">Entrenar només aquest exercici ↓</button></section><div class="exercise-hub-grid"><section class="card"><div class="section-head"><h2>${esc(e.name)}</h2><span class="tag">${kind==='bodyweight'?'Pes corporal':kind==='grip'?'Gripper':'Manuella'}</span></div><div class="exercise-records"><div><strong>${kind==='bodyweight'?data.bodyweightKg:bestWeight??'—'}<small>${kind==='bodyweight'?'kg corporals':kind==='grip'?'kg nominals':'kg / manuella'}</small></strong><span>${kind==='bodyweight'?'El teu pes':'Màxim registrat'}</span></div><div><strong>${kind==='bodyweight'?allSets.filter(s=>s.actual!=null).length:bestSet===null?'—':bestSet.toLocaleString('ca-ES')}<small>${kind==='bodyweight'?'sèries':'kg·reps'}</small></strong><span>${kind==='bodyweight'?'Amb repeticions / temps':'Millor sèrie amb reps'}</span></div><div><strong>${history.length}</strong><span>Sessions d’aquest exercici</span></div></div><div class="chart-metric-tabs">${options.map(([m,label])=>`<button data-strength-metric="${m}" class="${active[0]===m?'active':''}">${label}</button>`).join('')}</div>${history.length&&allSets.some(s=>s.tracking==='reps'&&s.actual==null)?'<p class="notice">La sessió està guardada. Si has passat sense anotar les repeticions, pots veure el temps i les sèries, però no les repeticions ni el volum. A l’historial, «Editar sessió» permet anotar les repeticions després si les recordes.</p>':''}${strengthChart(history,active[0],active[1],active[2])}${e.id==='pushup'?`<details class="model-details"><summary>Comptar el pes corporal a les flexions</summary><p>Pes corporal: ${data.bodyweightKg} kg. Amb el factor orientatiu ${(cfg.factor*100).toFixed(0)}%, el suport estimat és ${supportedLoad(e,data.bodyweightKg)} kg. No és una mesura directa ni equival a aixecar ${data.bodyweightKg} kg. La posició de mans, peus i cos modifica la càrrega.</p><div class="profile-fields"><label>Pes corporal (kg)<input id="bodyweight-kg" type="number" inputmode="decimal" min="20" max="300" step="0.1" value="${data.bodyweightKg}"></label><label>Factor estimat (0–1)<input data-ex-config="bodyweightFactor" data-ex-id="${esc(e.id)}" type="number" min="0.1" max="1" step="0.01" value="${cfg.factor}"></label></div><p>El volum estimat necessita repeticions reals i es mostra separat del volum de manuelles. Cada sèrie conserva el pes corporal i factor d’aquell dia.</p></details>`:''}</section><aside><section class="card quick-session"><h3>Fer només aquest exercici</h3><p class="muted">Ideal per a una sessió curta a qualsevol hora. No canvia el calendari de la rutina.</p><div class="quick-fields"><label>Sèries<input id="quick-sets" type="number" inputmode="numeric" min="1" max="10" value="1"></label>${kind!=='bodyweight'?`<label>${kind==='grip'?'Resistència':'Kg per manuella'}<input id="quick-load" type="number" inputmode="decimal" min="0" max="500" step="0.25" value="${e.loadKg||0}"></label>`:''}</div>${e.unilateral?'<p class="muted">Cada sèrie inclou esquerra i dreta, amb canvi guiat.</p>':''}<button class="primary" data-quick-start="${esc(e.id)}">Començar aquest exercici ${icon('arrow')}</button></section><section class="card progression-card"><h3>Progressió proposada</h3><p class="muted">Referència actual: ${e.target} ${e.tracking==='time'?'s':'reps'} · sostre del rang: ${cfg.top}.</p><p>${esc(suggestion.message)}</p>${suggestion.type!=='wait'?`<button class="primary" data-apply-progression="${esc(e.id)}">Aplicar ${suggestion.type==='weight'?suggestion.loadKg+' kg':suggestion.target+(e.tracking==='time'?' s':' reps')}</button>`:''}${kind==='dumbbell'?`<label>Increment disponible (kg)<input data-ex-config="stepKg" data-ex-id="${esc(e.id)}" type="number" inputmode="decimal" min="0.25" max="10" step="0.25" value="${cfg.step}"></label>`:''}<label>Sostre del rang (${e.tracking==='time'?'segons':'reps'})<input data-ex-config="progressionMax" data-ex-id="${esc(e.id)}" type="number" inputmode="numeric" min="${e.target}" max="600" step="1" value="${cfg.top}"></label><p class="muted">Sense esforç percebut ni pujades automàtiques. Les sèries interrompudes no serveixen per justificar un augment.</p></section></aside></div><section class="card exercise-history"><h3>Historial de ${esc(e.name.toLowerCase())}</h3>${history.length?history.slice().reverse().map(h=>`<details class="exercise-session"><summary><span>${new Date(h.at).toLocaleString('ca-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${h.log.quick?' · Ràpida':''}${h.log.endedEarly?' · Acabada abans':''}</span><strong>${h.sets.length} sèries / costats</strong></summary><div class="set-history-table">${h.sets.map(s=>`<div><span>Sèrie ${s.set} · ${s.side==='LEFT'?'esquerra':s.side==='RIGHT'?'dreta':'bilateral'}${s.partial?' · interrompuda':''}</span><b>${s.tracking==='time'?s.actual+' s':s.actual==null?'Reps no anotades':s.actual+' reps'}${s.loadKg?' · '+s.loadKg+' kg':''}</b><small>${s.tut}s de treball${externalVolume(s)!==null?' · '+externalVolume(s).toLocaleString('ca-ES')+' kg·reps':''}${s.estimatedSupportedKg?' · suport estimat '+s.estimatedSupportedKg+' kg':''}</small></div>`).join('')}</div><div class="session-edit-actions"><button class="secondary" data-edit-log="${esc(h.log.id)}">Editar sessió</button><button class="text-btn danger-text" data-remove-log="${esc(h.log.id)}">Eliminar sessió</button></div></details>`).join(''):'<div class="empty">Encara no has registrat aquest exercici. Les gràfiques s’ompliran amb les teves sessions.</div>'}</section></div>`}

function buildPlan(exercises){const plan=[];let i=0;while(i<exercises.length){const e=exercises[i];if(e.group){const group=[];while(i<exercises.length&&exercises[i].group===e.group)group.push(exercises[i++]);for(let s=1;s<=Math.max(...group.map(x=>x.sets));s++)group.forEach((x,j)=>{if(s<=x.sets)plan.push({ex:x,set:s,rest:j===group.length-1?x.rest:0})})}else{for(let s=1;s<=e.sets;s++)plan.push({ex:e,set:s,rest:e.rest});i++}}return plan}

function finish(s){execPhase='';if(!s.sets.length){render();toast('Sessió tancada. No hi havia sèries per guardar.');return}const log={id:s.id,title:s.title,synergy:s.synergy,routineId:s.routineId,quick:!!s.quick,endedEarly:!!s.endedEarly,plannedBlocks:s.plan.length,started:s.started,completed:Date.now(),delay:s.delay,tax:s.tax,low:s.low,note:s.note||'',tut:s.sets.reduce((a,x)=>a+x.tut,0),sets:s.sets,workload:s.sets.reduce((a,x)=>a+workload(x),0)};const routine=data.routines.find(r=>r.id===s.routineId);data.logs.push(log);if(!s.quick)data.draftNote='';save();archive(log).catch(()=>toast('Historial desat localment; IndexedDB no disponible.'));summary=log;renderSummary()}
function renderSummary(){const tonnage=summary.sets.reduce((a,s)=>a+(s.tracking==='reps'?(s.loadKg||0)*s.actual:0),0);app.innerHTML=`<main class="summary"><div class="summary-paper">${themeButton()}<span class="section-index">SESSIÓ REGISTRADA / ${new Date(summary.completed).toLocaleDateString('ca-ES')}</span><h1>${esc(summary.title)}</h1><p>${summary.endedEarly?'Acabada abans d’hora · feina feta guardada':summary.quick?'Sessió ràpida guardada':'Sessió guardada'}</p><p class="muted">${summary.sets.filter(s=>!s.partial).length} sèries / costats acabats${summary.sets.some(s=>s.partial)?' · '+summary.sets.filter(s=>s.partial).length+' sèrie interrompuda guardada':''}.</p><p>${new Date(summary.started).toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})} — ${new Date(summary.completed).toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})}</p><div class="summary-stats"><div><strong>${summary.sets.length}</strong><small>Sèries / costats</small></div><div><strong>${fmt(summary.tut)}</strong><small>Temps de treball</small></div><div><strong>${fmt((summary.completed-summary.started)/1000)}</strong><small>Durada total</small></div></div>${summary.note?'<p class="session-note-saved">'+esc(summary.note)+'</p>':''}<p class="muted">Temps registrat entre l’inici de cada sèrie i el toc a «He acabat». Les repeticions només es desen si les has anotat. No es demana esforç percebut.</p><button class="secondary" data-exercise-detail="${esc(summary.sets[0].exercise)}">Veure registre i gràfica</button><button class="primary" data-action="close-summary">Tornar a l’entrenament ${icon('arrow')}</button></div></main>`}
app.addEventListener('click',event=>{const overviewPoint=event.target.closest('[data-overview-chart]');if(overviewPoint){const caption=document.querySelector('#overview-caption-'+overviewPoint.dataset.overviewChart);if(caption)caption.textContent=overviewPoint.dataset.overviewValue;return}const point=event.target.closest('[data-chart-detail]');if(point){const caption=document.querySelector('#chart-point-detail');if(caption)caption.textContent=point.dataset.chartDetail;return}const b=event.target.closest('button'),nav=b?.dataset.page,act=b?.dataset.action;if(b?.dataset.removeLog){askRemoveLog(b.dataset.removeLog);return}if(b?.dataset.editLog){editSavedLog(b.dataset.editLog);return}if(b?.dataset.exerciseDetail){summary=null;showExercise(b.dataset.exerciseDetail);return}if(b?.dataset.strengthMetric){strengthMetric=b.dataset.strengthMetric;render();return}if(b?.dataset.quickStart){quickStart(b.dataset.quickStart);return}if(b?.dataset.applyProgression){const e=catalog(data.routines).find(x=>x.id===b.dataset.applyProgression),proposal=recommendation(e,data.logs);if(proposal.type!=='wait'){for(const r of data.routines)for(const x of r.exercises)if(x.id===e.id){x.target=proposal.target;if(proposal.type==='weight')x.loadKg=proposal.loadKg;else{x.progressionMax=proposal.target;if(x.repMax)x.repMax=proposal.target}}save();render();toast('Nova referència aplicada.')}}if(b?.hasAttribute('data-day')){previewDay=+b.dataset.day;render();return}if(b?.hasAttribute('data-forecast')){setForecast(+b.dataset.forecast);refreshMap();return}if(b?.hasAttribute('data-map-filter')){setMapFilter(b.dataset.mapFilter);refreshMap();return}if(b?.dataset.mapView){selectView(b.dataset.mapView);refreshMap();return}if(nav){routeScroll[page]=window.scrollY;page=nav;editDay=data.routines.indexOf(selected());render();window.scrollTo(0,routeScroll[page]||0);return}const muscle=event.target.closest('[data-muscle]');if(muscle){selectMuscle(+muscle.dataset.muscle);refreshMap();return}if(b?.dataset.log){const l=data.logs.find(x=>x.id===b.dataset.log);const w=document.createElement('dialog');w.style.cssText='border:1px solid #d6dfca;border-radius:16px;max-width:650px;padding:25px';w.innerHTML=`<h2>${esc(l.title)}</h2>${l.note?'<p class="session-note-saved">'+esc(l.note)+'</p>':''}${l.sets.map(s=>`<p>${esc(s.name)} · ${s.side} · ${s.actual==null?'Repeticions no anotades':s.actual+' '+(s.tracking==='time'?'s':'reps')}${s.loadKg?' · '+s.loadKg+' kg':''} · ${s.tut}s de treball${s.partial?' · Sèrie interrompuda':''}${s.failure?' · Tècnica interrompuda':''}</p>`).join('')}<div class="session-edit-actions"><button class="secondary" data-dialog-edit>Editar sessió</button><button class="text-btn danger-text" data-dialog-delete>Eliminar sessió</button></div><form method="dialog"><button class="secondary">Tancar</button></form>`;document.body.append(w);w.showModal();w.querySelector('[data-dialog-edit]').onclick=()=>{w.close();editSavedLog(l.id)};w.querySelector('[data-dialog-delete]').onclick=()=>{w.close();askRemoveLog(l.id)};w.addEventListener('close',()=>w.remove());return}if(b?.hasAttribute('data-move')){const es=data.routines[editDay].exercises,i=+b.dataset.move,j=i+(+b.dataset.dir);if(j>=0&&j<es.length)[es[i],es[j]]=[es[j],es[i]];save();render();return}if(b?.hasAttribute('data-delete')){const es=data.routines[editDay].exercises;if(es.length===1&&data.routines[editDay].synergy!=='REST'){toast('La rutina ha de tenir un exercici.');return}es.splice(+b.dataset.delete,1);save();render();return}if(b?.hasAttribute('data-clone')){const es=data.routines[editDay].exercises,e=structuredClone(es[+b.dataset.clone]);e.id=crypto.randomUUID();es.splice(+b.dataset.clone+1,0,e);save();render();return}
if(act==='toggle-theme'){data.theme=data.theme==='dark'?'light':'dark';save();applyTheme();document.querySelectorAll('[data-action="toggle-theme"]').forEach(button=>{button.innerHTML=data.theme==='dark'?'☀ Clar':'☾ Fosc';button.setAttribute('aria-pressed',String(data.theme==='dark'))});return}if(act==='jump-quick'){document.querySelector('.quick-session')?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});return}if(act==='finish-early'){openEndDialog();return}if(act==='show-map'){document.querySelector('.map-toolbar')?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});return}if(act==='toggle-sound'){data.sound=data.sound===false;setAudio(data.sound);save();render();return}if(act==='extend-rest'){engine.extendRest(15);return}if(act==='skip-rest'&&['REST','MYO_REST'].includes(engine.s?.phase)){engine.phase('GET_READY',5);return}if(act==='start'){if(!selected().exercises.length)return;initAudio();const d=delay();let actualDelay=Math.min(d,180);const r=selected();const last=data.logs.at(-1);setAudio(data.sound!==false);engine.start(r,{low,delay:actualDelay,manual:true,bodyweightKg:data.bodyweightKg,ramp:last&&Date.now()-last.started>7*86400000});engine.s.note=data.draftNote||'';engine.persist();try{if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'PRIMER · Sessió activa',artist:'Quadern d’entrenament'});navigator.mediaSession.setActionHandler('nexttrack',()=>{if(engine.s?.phase==='WORK_REPS')completeCurrentSet();else engine.advance()});navigator.mediaSession.setActionHandler('pause',()=>engine.pause());navigator.mediaSession.setActionHandler('play',()=>{if(engine.s?.paused)engine.pause()})}}catch{}return}
if(act==='optimal'||act==='low'){low=act==='low';render()}if(act?.startsWith('cycle-')){data.offset+=act==='cycle-plus'?1:-1;save();render()}if(act==='pause'){engine.pause()}if(act==='abort'&&confirm('Vols acabar la sessió? Les sèries parcials continuen a IndexedDB, però no es comptarà com a sessió completada.')){engine.abort();execPhase='';render()}if(act==='failure'||act==='complete-set'){if(Date.now()-(engine.changedAt||0)>1200)completeCurrentSet(act==='failure')}if(act==='overtime'){engine.s.allowOvertime=!engine.s.allowOvertime;engine.persist();b.textContent=engine.s.allowOvertime?'✓ Extra activat':'Activar temps extra'}if(act==='close-summary'){summary=null;page='home';render()}if(act==='toggle-editor'){codeMode=!codeMode;render()}if(act==='save-dsl'){try{const txt=document.querySelector('#dsl').value;data.routines[editDay].exercises=data.routines[editDay].synergy==='REST'&&txt.split('\n').every(l=>!l.trim()||l.trim().startsWith('#'))?[]:parseDSL(txt,data.routines[editDay].exercises);save();toast('Rutina validada i desada.')}catch(e){toast(e.message)}}if(act==='add-exercise'){data.routines[editDay].exercises.push({id:crypto.randomUUID(),name:'Nou exercici',target:30,sets:2,rest:30,tracking:'time',mode:'STANDARD',tier:1,ceiling:60,category:'ANTI_EXTENSION',cues:['COLUMNA NEUTRA','RESPIRA FLUID']});save();render()}if(act==='json')download('primer-backup-'+today()+'.json',JSON.stringify(data,null,2));if(act==='csv'){download('workouts_summary.csv',csv(data.logs.map(({sets,...l})=>l)),'text/csv;charset=utf-8');setTimeout(()=>download('sets_granular_telemetry.csv',csv(data.logs.flatMap(l=>l.sets.map(({weights,...s})=>({...s,workout_id:l.id})))),'text/csv;charset=utf-8'),350)}if(act==='import'){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const value=JSON.parse(await input.files[0].text());if(confirm('Substituir totes les dades locals per aquesta còpia?')){replace(value);summary=null;render();toast('Còpia restaurada.')}}catch(e){toast('No s’ha importat: '+e.message)}};input.click()}if(act==='install'){if(installPrompt){installPrompt.prompt();installPrompt=null}else toast('Obre el menú del navegador → Instal·lar app o Afegeix a inici.')}});
app.addEventListener('change',e=>{if(e.target.id==='overview-range'||e.target.id==='overview-type'){if(e.target.id==='overview-range')overviewRange=e.target.value==='all'?'all':Number(e.target.value);else overviewType=e.target.value;const y=window.scrollY;render();document.querySelector('#'+e.target.id)?.focus({preventScroll:true});window.scrollTo(0,y);return}if(e.target.id==='exercise-select'){activeExerciseId=e.target.value;strengthMetric='weight';render();return}if(e.target.id==='bodyweight-kg'){const value=Number(e.target.value);if(!Number.isFinite(value)||value<20||value>300){toast('Pes corporal entre 20 i 300 kg.');return}data.bodyweightKg=value;save();render();return}if(e.target.dataset.exConfig){const key=e.target.dataset.exConfig,value=Number(e.target.value),min=key==='progressionMax'?(catalog(data.routines).find(x=>x.id===e.target.dataset.exId)?.target||1):key==='bodyweightFactor'?0.1:key==='dumbbellCount'?1:.25,max=key==='progressionMax'?600:key==='bodyweightFactor'?1:key==='dumbbellCount'?2:10;if(!Number.isFinite(value)||value<min||value>max||(key==='progressionMax'&&!Number.isInteger(value))){toast('Valor fora de rang.');return}for(const r of data.routines)for(const x of r.exercises)if(x.id===e.target.dataset.exId)x[key]=value;save();render();return}if(e.target.id==='mobile-muscle-select'){selectMuscle(+e.target.value);refreshMap();document.querySelector('.muscle-detail')?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});return}if(e.target.hasAttribute('data-load')){const kg=Number(e.target.value);if(!Number.isFinite(kg)||kg<0||kg>500){toast('El pes ha d’estar entre 0 i 500 kg.');render();return}for(const r of data.routines)for(const x of r.exercises)if(x.id===e.target.dataset.load)x.loadKg=kg;save();return}if(e.target.id==='session-note'){data.draftNote=e.target.value;save();return}if(e.target.id==='edit-day'){editDay=+e.target.value;render()}const f=e.target.dataset.field;if(f){const n=+e.target.dataset.i,x=data.routines[editDay].exercises[n],v=f==='name'?e.target.value.trim():Number(e.target.value);if(f==='name'?!v:!Number.isFinite(v)||v<Number(e.target.min)||v>Number(e.target.max)){toast('Valor fora de rang');render();return}x[f]=v;save();toast('Canvi desat')}});
let dragFrom;app.addEventListener('dragstart',e=>{dragFrom=+e.target.closest('[data-index]')?.dataset.index;e.dataTransfer.effectAllowed='move'});app.addEventListener('dragover',e=>e.preventDefault());app.addEventListener('drop',e=>{e.preventDefault();const row=e.target.closest('[data-index]');if(!row||!Number.isInteger(dragFrom))return;const es=data.routines[editDay].exercises;es.splice(+row.dataset.index,0,es.splice(dragFrom,1)[0]);save();render()});

function savedLogDialog(title){const dialog=document.createElement('dialog');dialog.className='saved-log-dialog';dialog.setAttribute('aria-label',title);document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove());return dialog}
function askRemoveLog(id){const log=data.logs.find(l=>l.id===id);if(!log)return;const dialog=savedLogDialog('Eliminar sessió');dialog.innerHTML=`<h2>Eliminar aquesta sessió?</h2><p><strong>${esc(log.title)}</strong> · ${new Date(log.started).toLocaleString('ca-ES')}</p><p>S’eliminarà la sessió sencera amb els seus ${log.sets.length} registres de sèries / costats. Deixarà de comptar al calendari, les gràfiques, els rècords, la recuperació i les propostes de progressió.</p><p>No es modifica la rutina programada ni el calendari A/B. Aquesta acció no es pot desfer; si la vols conservar, exporta abans una còpia JSON.</p><div class="session-edit-actions"><button class="secondary" data-cancel>Cancel·lar</button><button class="primary danger-button" data-confirm-delete>Eliminar definitivament</button></div>`;dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();dialog.querySelector('[data-confirm-delete]').onclick=()=>{const before=data.logs;data.logs=data.logs.filter(l=>l.id!==id);try{save()}catch{data.logs=before;toast('No s’ha pogut desar el canvi. La sessió no s’ha eliminat.');return}if(summary?.id===id)summary=null;dialog.close();render();toast('Sessió eliminada del registre.');removeArchivedLog(id).catch(()=>toast('Sessió eliminada del registre; no s’ha pogut netejar la còpia IndexedDB.'))};dialog.showModal();dialog.querySelector('[data-cancel]').focus()}
function editSavedLog(id){const log=data.logs.find(l=>l.id===id);if(!log)return;const dialog=savedLogDialog('Editar sessió');dialog.innerHTML=`<form id="saved-log-form"><h2>Editar sessió guardada</h2><p>${esc(log.title)} · ${new Date(log.started).toLocaleString('ca-ES')}</p><p>Corregeix només les dades que recordis. Un camp buit vol dir «no anotat», no zero. No es canvien el temps, la rutina programada ni la marca d’una sèrie interrompuda.</p><div class="saved-set-list">${log.sets.map((s,i)=>`<fieldset><legend>${esc(s.name)} · sèrie ${s.set??i+1} · ${s.side==='LEFT'?'esquerra':s.side==='RIGHT'?'dreta':'bilateral'}${s.partial?' · interrompuda':''}</legend><span>${s.tut}s de treball guardats</span><div class="live-set-fields">${s.tracking==='reps'?`<label>Repeticions reals<input data-saved-reps="${i}" type="number" inputmode="numeric" min="0" max="200" step="1" placeholder="No anotades" value="${s.actual??''}"></label>`:'<p>Exercici per temps: es conserva el temps registrat.</p>'}${s.loadKind!=='bodyweight'&&s.exercise!=='pushup'&&s.tracking==='reps'?`<label>${s.loadKind==='grip'?'Resistència (kg)':'Kg per manuella'}<input data-saved-load="${i}" type="number" inputmode="decimal" min="0" max="500" step="0.25" placeholder="No anotat" value="${s.loadKg??''}"></label>`:''}</div></fieldset>`).join('')}</div><p class="saved-log-error" role="alert"></p><div class="session-edit-actions"><button type="button" class="secondary" data-cancel>Cancel·lar</button><button type="submit" class="primary">Desar canvis</button></div></form>`;dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=event=>{event.preventDefault();const sets=structuredClone(log.sets);for(const input of dialog.querySelectorAll('[data-saved-reps],[data-saved-load]')){const reps=input.hasAttribute('data-saved-reps'),index=Number(reps?input.dataset.savedReps:input.dataset.savedLoad),v=input.value.trim()===''?null:Number(input.value);if(v!==null&&(!Number.isFinite(v)||v<0||v>(reps?200:500)||(reps&&!Number.isInteger(v)))){dialog.querySelector('.saved-log-error').textContent='Revisa els valors: reps enteres de 0 a 200 i pes de 0 a 500 kg.';input.focus();return}sets[index][reps?'actual':'loadKg']=v;if(reps)sets[index].completion_source='manual-edited'}const before=log.sets;log.sets=sets;try{save()}catch{log.sets=before;dialog.querySelector('.saved-log-error').textContent='No s’han pogut desar els canvis.';return}archive(log).catch(()=>toast('Canvis desats al registre; IndexedDB no disponible.'));dialog.close();render();toast('Sessió actualitzada. Gràfiques i progressió recalculades.')};dialog.showModal()}
